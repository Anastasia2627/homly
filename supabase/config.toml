# HOMLY edge functions. The payment webhook has its own ECDSA signature.
# All other functions require a valid Supabase user JWT.
[functions.homly-create-checkout]
verify_jwt = true

[functions.homly-mono-webhook]
verify_jwt = false

[functions.homly-sync-order]
verify_jwt = true

[functions.homly-reconcile-pending]
verify_jwt = false

[functions.homly-email-dispatch]
verify_jwt = false

[functions.homly-telegram-alerts]
verify_jwt = false

[functions.homly-np-locations]
verify_jwt = true

[functions.homly-integration-status]
verify_jwt = true
